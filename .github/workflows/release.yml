name: Build and release NovaLand
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novaland-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'
      - name: Build, verify and package
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/NovaLand/NovaLand.csproj
          "version=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: artifacts/NovaLand_v*_win-x64.zip
          if-no-files-found: error
          retention-days: 7
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: package
      - name: Publish only a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --json tagName > /dev/null 2>&1; then
            echo "Release $tag already exists; keeping it unchanged."
            exit 0
          fi
          gh release create "$tag" "package/NovaLand_v${VERSION}_win-x64.zip" \
            --target "$COMMIT" --title "NovaLand ${VERSION}" --generate-notes --latest
